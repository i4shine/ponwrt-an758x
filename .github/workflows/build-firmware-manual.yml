name: Build Firmware (HG5585F-CT / HG5382A) manual

# ==============================================================================
# 只允许手动触发（workflow_dispatch）：不配置 push / schedule / pull_request，
# 避免任何提交或定时行为把线上固件自动重编。
#
# 基线来自上游 wuziwei 的 build-zn504.yml，改动点：
#   1) 机型收敛为 HG5585F-CT 与 HG5382A 两个，构建前把其它 7 个机型全部关掉，
#      多 profile 不再重复建 rootfs，编译时间大幅下降；
#   2) 产物收集显式包含 *hg5382a*sysupgrade.itb（上游 find 只匹配 zn504/hg5585f，
#      HG5382A 虽然会被编出来但被名字过滤静默丢弃，这里补上并做存在性硬校验）；
#   3) 配置改为三份合并：configs/an7581.config + configs/release.config
#      + configs/pon-userspace.config（本仓库新增的上层应用清单）；
#   4) 保持上游的 “defconfig 之后不再 defconfig” 顺序：机型锁定放在 defconfig 之后。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      devices:
        description: '编译机型'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'hg5585f-ct'
          - 'hg5382a'
      cache_mode:
        description: '编译缓存模式'
        required: true
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '完全重建'
      upload_release:
        description: '编译成功后发布到 GitHub Release'
        required: true
        default: false
        type: boolean

concurrency:
  group: manual-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  firmware:
    name: Build firmware (${{ inputs.devices }})
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Restore downloads cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-manual-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-manual-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages and patches
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: inputs.cache_mode != '完全重建'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-manual-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-manual-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-manual-

      - name: Configure for the requested device(s)
        run: |
          set -euo pipefail

          # 三份配置合并：基线机型/内核 + 上游 release 强化集 + 本仓库上层应用清单
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config \
            configs/pon-userspace.config > .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          if [ "${{ inputs.cache_mode }}" != "完全重建" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          # 第一次也是唯一一次 defconfig：把依赖解析干净
          make defconfig

          # ------------------------------------------------------------------
          # 机型锁定（必须在 defconfig 之后）：
          # make defconfig 会按 Kconfig 重新展开设备列表，手工追加的机型行会被回退；
          # 这里先把 an7581.config 里选中的其它 7 个机型全部置空，再写入本次要编的机型，
          # 之后**不再**执行 defconfig，避免机型行被再次重算。
          # ------------------------------------------------------------------
          case "${{ inputs.devices }}" in
            hg5585f-ct) DEVICES="fiberhome_hg5585f-ct" ;;
            hg5382a)    DEVICES="fiberhome_hg5382a" ;;
            *)          DEVICES="fiberhome_hg5585f-ct fiberhome_hg5382a" ;;
          esac

          echo ">>> 目标机型: $DEVICES (其它机型全部关闭)"
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          for d in $DEVICES; do
            printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$d" >> .config
          done

          # 硬校验：两个机型符号必须真的落进 .config
          for d in $DEVICES; do
            grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${d}=y" .config \
              || { echo "::error::机型符号未落地: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${d}=y"; exit 1; }
          done
          echo ">>> 机型锁定完成（未再执行 defconfig）"

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-manual-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && inputs.cache_mode != '完全重建'
        run: |
          [ -x staging_dir/host/bin/ccache ] && staging_dir/host/bin/ccache -s || true

      - name: Collect and verify firmware artifacts
        run: |
          set -euo pipefail
          mkdir -p output
          find bin/targets/airoha/an7581/ -type f \( -name '*sysupgrade.itb' -o -name '*recovery.itb' -o -name '*manifest' \) -exec cp {} output/ \;

          echo "=== 收集到的产物 ==="
          ls -lh output/ || true

          fail=0
          case "${{ inputs.devices }}" in
            hg5585f-ct|both)
              ls output/*hg5585f-ct*sysupgrade.itb >/dev/null 2>&1 \
                || { echo "::error::缺少 HG5585F-CT 的 sysupgrade.itb（预期 *hg5585f-ct*sysupgrade*.itb）"; fail=1; } ;;
          esac
          case "${{ inputs.devices }}" in
            hg5382a|both)
              ls output/*hg5382a*sysupgrade.itb >/dev/null 2>&1 \
                || { echo "::error::缺少 HG5382A 的 sysupgrade.itb（预期 *hg5382a*sysupgrade*.itb）"; fail=1; } ;;
          esac

          cd output
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"
          exit $fail

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-manual-firmware-${{ inputs.devices }}-${{ github.run_number }}
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: inputs.upload_release
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')-manual" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to GitHub Release
        if: inputs.upload_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt manual build (${{ inputs.devices }}) ${{ steps.tag.outputs.release_tag }}
          body: |
            手动构建产物，机型：${{ inputs.devices }}。
            配置来源：configs/an7581.config + configs/release.config + configs/pon-userspace.config。
            内核与 kmod 使用同一源码树，ABI 与 build-packages-incremental.yml 产出的 apk 完全一致。
          files: output/*
